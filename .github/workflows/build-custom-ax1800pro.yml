name: AX1800 Pro Custom iStoreOS V2

on:
  workflow_dispatch:
  push:
    paths:
      - 'custom/**'
      - '.github/workflows/build-custom-ax1800pro.yml'

permissions:
  contents: write

env:
  TZ: Asia/Shanghai
  FORCE_UNSAFE_CONFIGURE: 1

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib gettext git \
            libncurses-dev libssl-dev python3 python3-setuptools \
            rsync swig unzip zlib1g-dev file wget xsltproc qemu-utils ccache

      - name: Prepare feeds and FORCE AX1800 Pro target
        shell: bash
        run: |
          set -e
          echo '=== Updating feeds ==='
          ./scripts/feeds update -a
          ./scripts/feeds install -a

          echo '=== Forcing the ORIGINAL AX1800 Pro target only ==='
          # Do NOT select a new board such as OpenWrt One / MediaTek.
          # These are the exact target symbols for JDCloud RE-SS-01.
          sed -i '/^CONFIG_TARGET_qualcommax=/d' .config 2>/dev/null || true
          sed -i '/^CONFIG_TARGET_qualcommax_ipq60xx=/d' .config 2>/dev/null || true
          sed -i '/^CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_/d' .config 2>/dev/null || true
          cat >> .config <<'CFG'
CONFIG_TARGET_qualcommax=y
CONFIG_TARGET_qualcommax_ipq60xx=y
CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_jdcloud_re-ss-01=y
CFG

          echo '=== Target before defconfig ==='
          grep -E '^CONFIG_TARGET_(qualcommax|qualcommax_ipq60xx|qualcommax_ipq60xx_DEVICE_)' .config || true

          make defconfig

          echo '=== Target after defconfig ==='
          grep -E '^CONFIG_TARGET_(qualcommax|qualcommax_ipq60xx|qualcommax_ipq60xx_DEVICE_)' .config || true

          test "$(grep -c '^CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_jdcloud_re-ss-01=y' .config)" -eq 1

      - name: Apply custom packages
        shell: bash
        run: |
          set -e
          chmod +x custom/apply-custom-packages.sh
          ./custom/apply-custom-packages.sh
          echo '=== package check ==='
          cat custom/package-check.log || true

          echo '=== final target check ==='
          grep -E '^CONFIG_TARGET_(qualcommax|qualcommax_ipq60xx|qualcommax_ipq60xx_DEVICE_)' .config || true
          test "$(grep -c '^CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_jdcloud_re-ss-01=y' .config)" -eq 1

      - name: Build firmware
        shell: bash
        run: |
          set -e
          make download -j$(nproc) V=s
          make -j$(nproc) V=s

      - name: Verify AX1800 Pro images
        shell: bash
        run: |
          set -e
          echo '=== Target image directory ==='
          find bin/targets/qualcommax/ipq60xx -maxdepth 1 -type f -print | sort

          echo '=== Required AX1800 Pro images ==='
          find bin/targets/qualcommax/ipq60xx -type f \
            \( -name '*jdcloud_re-ss-01*factory.bin' -o -name '*jdcloud_re-ss-01*sysupgrade.bin' \) -print

          FACTORY="$(find bin/targets/qualcommax/ipq60xx -type f -name '*jdcloud_re-ss-01*factory.bin' -print -quit)"
          SYSUPGRADE="$(find bin/targets/qualcommax/ipq60xx -type f -name '*jdcloud_re-ss-01*sysupgrade.bin' -print -quit)"

          test -n "$FACTORY"
          test -n "$SYSUPGRADE"

          echo "FACTORY=$FACTORY"
          echo "SYSUPGRADE=$SYSUPGRADE"

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ax1800pro-custom-firmware-v2
          path: |
            bin/targets/qualcommax/ipq60xx/*.bin
            bin/targets/qualcommax/ipq60xx/*.manifest
            custom/package-check.log
          if-no-files-found: error
          retention-days: 30
