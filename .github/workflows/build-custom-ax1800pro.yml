name: AX1800 Pro Custom iStoreOS

on:
  workflow_dispatch:
  push:
    paths:
      - 'custom/**'
      - '.github/workflows/build-custom-ax1800pro.yml'

permissions:
  contents: write

env:
  TZ: Asia/Shanghai
  FORCE_UNSAFE_CONFIGURE: 1

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib gettext git \
            libncurses-dev libssl-dev python3 python3-setuptools python3-pip \
            rsync swig unzip zlib1g-dev file wget xsltproc qemu-utils ccache

      - name: Prepare feeds and custom packages
        run: |
          chmod +x custom/apply-custom-packages.sh
          ./custom/apply-custom-packages.sh
          echo '--- selected package check ---'
          cat custom/package-check.log

      - name: Build firmware
        run: |
          make download -j$(nproc) V=s
          make -j$(nproc) V=s

      - name: Verify AX1800 Pro images
        run: |
          echo 'Searching for factory.bin and sysupgrade.bin...'
          find bin/targets -type f \( -name '*factory.bin' -o -name '*sysupgrade.bin' \) -print
          test -n "$(find bin/targets -type f -name '*factory.bin' -print -quit)"
          test -n "$(find bin/targets -type f -name '*sysupgrade.bin' -print -quit)"

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ax1800pro-custom-firmware
          path: |
            bin/targets/**/*.bin
            bin/targets/**/*.manifest
            custom/package-check.log
          if-no-files-found: error
          retention-days: 30
